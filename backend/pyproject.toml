[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "carborewind-api"
version = "0.1.0.dev0"
description = "CarboRewind control-plane REST API"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<9",
  "argon2-cffi>=23.1,<26",
  "ldap3>=2.9,<3",
  "cryptography>=43",
  "email-validator>=2.1,<3",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",  # used by openpyxl to parse uploaded .xlsx files safely
]

[project.scripts]
carborewind-api = "carborewind_api.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carborewind_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ldap3", "ldap3.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = ["integration: requires PostgreSQL (CARBOREWIND_TEST_DATABASE_URL)"]
addopts = "--cov=carborewind_api --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
# SQLAlchemy's async layer runs ORM code in greenlets; LDAP runs in worker threads.
concurrency = ["greenlet", "thread"]
