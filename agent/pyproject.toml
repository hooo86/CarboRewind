[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "carborewind-agent"
version = "0.0.0"
description = "CarboRewind agent running on the Carbonio host"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "cryptography>=43",
  "zstandard>=0.23,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
carborewind-agent = "carborewind_agent.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carborewind_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]

[tool.coverage.run]
concurrency = ["thread"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The simulator names its handlers after the SOAP requests (_SyncRequest…).
"tests/fake_carbonio.py" = ["N802"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=carborewind_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
