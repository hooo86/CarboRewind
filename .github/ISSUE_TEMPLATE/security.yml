name: 🛡️ Durcissement sécurité / Security hardening
description: Amélioration de sécurité NON sensible (pas une vulnérabilité exploitable)
labels: [security, triage]
body:
  - type: markdown
    attributes:
      value: |
        ⛔ **Vulnérabilité exploitable ?** Ne remplissez PAS ce formulaire public :
        utilisez le signalement privé (Security → Report a vulnerability), voir SECURITY.md.
  - type: textarea
    id: area
    attributes:
      label: Zone concernée / Area
      description: ex. en-têtes HTTP, rotation de clés, RBAC, chiffrement, CI…
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Amélioration proposée / Proposed hardening
    validations: { required: true }
  - type: textarea
    id: references
    attributes:
      label: Références (OWASP, CIS, ANSSI…)
